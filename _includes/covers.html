<section class="section section-covers" id="covers">
  <div class="shell cover-layout">
    <div class="cover-copy">
      <p class="eyebrow eyebrow-light">Journal cover</p>
      <h2>Research beyond the paper.</h2>
      <p>Featured cover art for work on CO<sub>2</sub> harvesting from N<sub>2</sub> using grazyne membranes.</p>
      {% assign cover = site.data.covers.first %}
      <p class="cover-meta">{{ cover.journal }} · {{ cover.issue }} · {{ cover.year }}</p>
      <a class="button button-light" href="{{ cover.link }}" target="_blank" rel="noopener noreferrer">View cover feature <span aria-hidden="true">↗</span></a>
    </div>
    <a class="cover-art" href="{{ cover.pdf | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="Open the {{ cover.journal }} cover as PDF">
      <img src="{{ cover.thumbnail | relative_url }}" alt="{{ cover.alt }}" loading="lazy">
    </a>
  </div>
</section>
