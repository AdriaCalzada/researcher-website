<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#071b2b">
  <title>{{ site.title }} · {{ site.subtitle }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="keywords" content="{{ site.keywords | escape }}">
  <meta name="author" content="{{ site.meta_author | escape }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/img/con-only-logo-coastal.png' | relative_url }}">
  <link rel="preload" href="{{ '/img/profile.webp' | relative_url }}" as="image" type="image/webp">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
