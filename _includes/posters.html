<section class="section section-posters" id="posters">
  <div class="shell">
    <div class="section-heading section-heading-dark">
      <div><p class="eyebrow">Conferences</p><h2>Posters.</h2></div>
      <p>Visual summaries of research shared with the scientific community.</p>
    </div>
    <div class="poster-grid">
      {% for poster in site.data.posters %}
      <article class="poster-card">
        <a class="poster-preview" href="{{ poster.pdf | relative_url }}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ poster.title | strip_html }} as PDF">
          <img src="{{ poster.thumbnail | relative_url }}" alt="Preview of the poster {{ poster.title | strip_html }}" loading="lazy">
          <span>Open full poster <i aria-hidden="true">↗</i></span>
        </a>
        <div class="poster-info">
          <p>{{ poster.event }} · {{ poster.year }}</p>
          <h3>{{ poster.title }}</h3>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
