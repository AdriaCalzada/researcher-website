<!-- Header -->
<header class="hero-modern">
  <div class="container">
    <div class="hero-grid">
      <div class="hero-copy">
        <img class="hero-logo" src="img/con-only-logo-coastal.png" alt="Adrià Calzada logo">
        <div class="hero-eyebrow">{{ site.subtitle }}</div>
        <h1 class="hero-title">{{ site.title }}</h1>
        <p class="hero-dept">Materials science and physical chemistry department · University of Barcelona</p>

        <div class="hero-chips">
          <span class="hero-chip">DFT</span>
          <span class="hero-chip">Molecular Dynamics</span>
          <span class="hero-chip">Molecular Separation</span>
          <span class="hero-chip">Catalysis</span>
        </div>

        <div class="hero-actions">
          <a class="hero-btn primary" href="#portfolio">View Articles</a>
          <a class="hero-btn ghost" href="mailto:adria.calzada@ub.edu">Contact</a>
        </div>

        <div class="hero-social">
          <a class="hero-social-link" href="mailto:adria.calzada@ub.edu" aria-label="Email">
            <i class="fa fa-envelope"></i>
          </a>
          <a class="hero-social-link" href="https://scholar.google.com/citations?user=BHxnYEYAAAAJ&hl=ca" target="_blank" rel="noopener" aria-label="Google Scholar">
            <i class="fa fa-graduation-cap"></i>
          </a>
          <a class="hero-social-link" href="https://www.researchgate.net/profile/Adria-Calzada" target="_blank" rel="noopener" aria-label="ResearchGate">
            <i class="fa fa-graduation-cap"></i>
          </a>
          <a class="hero-social-link" href="https://github.com/" target="_blank" rel="noopener" aria-label="GitHub">
            <i class="fa fa-github"></i>
          </a>
        </div>
      </div>

      <div class="hero-media">
        <div class="hero-portrait-frame">
          <img class="img-responsive profile-pic" src="img/profile.jpg" alt="profile-pic" />
        </div>
        <div class="hero-caption">
          <span>Computational chemistry</span>
        </div>
      </div>
    </div>
    <a class="hero-scroll" href="#about" aria-label="Scroll to About">
      <span class="hero-scroll-label">Scroll</span>
      <span class="hero-scroll-dot"></span>
    </a>
  </div>
</header>
