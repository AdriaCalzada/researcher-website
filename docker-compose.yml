services:
  jekyll:
    build: .
    working_dir: /srv/jekyll
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    ports:
      - "4000:4000"
      - "35729:35729"
    command: >
      bash -lc "bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force_polling --config _config.yml,_config_local.yml"
volumes:
  bundle_cache: